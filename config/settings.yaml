# Configuracao do bot de arbitragem - modo padrao: PAPER TRADING (sem dinheiro real)
exchange:
  id: binance        # id do ccxt; nao precisa de API key/secret para dados publicos

base_currency: USDT

triangular:
  enabled: true
  # moedas alternativas usadas para montar os triangulos BASE -> X -> Y -> BASE
  alt_currencies: [BTC, ETH, BNB, SOL, XRP, ADA, DOGE, MATIC, LTC, TRX]

cross_exchange:
  enabled: true
  # com >= 2 exchanges o detector passa a comparar precos de fato.
  # BNB/USDT nao existe na Kraken, entao foi removido dos symbols abaixo
  # (ExchangeClient.has_symbol filtraria sozinho, mas evita ruido no log).
  exchanges: [binance, kraken, kucoin]
  symbols: [BTC/USDT, ETH/USDT, SOL/USDT, XRP/USDT]
  # Capital pre-posicionado em cada exchange. Arbitragem real entre exchanges
  # nao da tempo de transferir fundos durante a janela da oportunidade: e
  # preciso ja ter moeda de cotacao (para comprar) E moeda base (para vender)
  # em CADA exchange antes de operar. Sem isso configurado, trades
  # cross-exchange ficam sem inventario para validar e nunca sao executados.
  allocation:
    binance:
      USDT: 500.0
      BTC: 0.01
      ETH: 0.1
      SOL: 1.0
      XRP: 100.0
    kraken:
      USDT: 500.0
      BTC: 0.01
      ETH: 0.1
      SOL: 1.0
      XRP: 100.0
    kucoin:
      USDT: 500.0
      BTC: 0.01
      ETH: 0.1
      SOL: 1.0
      XRP: 100.0
  # Avisa (warning no log) quando o saldo de uma moeda numa exchange cair
  # abaixo desta fracao do saldo inicial alocado -- sinal de que e hora de
  # transferir fundos entre as exchanges para rebalancear.
  rebalance_warning_pct: 0.5

risk:
  initial_capital: 1000.0      # capital virtual inicial (paper trading)
  max_trade_pct: 0.02          # no maximo 2% do capital por operacao
  min_profit_pct: 0.003        # so opera se lucro liquido estimado >= 0.3%
  max_daily_loss_pct: 0.05     # circuit breaker: trava o bot apos perder 5% do capital no dia
  taker_fee_pct: 0.001         # taxa taker padrao (0.1%) aplicada em cada perna da operacao

loop:
  # 15s anteriormente. Reduzido para detectar oportunidades antes que fechem
  # (cada rodada faz so 1 chamada fetch_tickers por exchange, entao a baixo
  # interval_seconds nao deve violar rate limit -- a kraken e a mais restrita,
  # com 1 req/s atraves do proprio limitador do ccxt). Se aparecerem erros de
  # rate limit/ban temporario no log, aumente este valor de volta.
  interval_seconds: 5

logging:
  level: INFO
  trades_log_path: data/trades.csv
  opportunities_log_path: data/opportunities.csv

# Execucao real (ordens de verdade, dinheiro de verdade). DESLIGADO por padrao.
# `enabled: true` aqui e so 1 dos 3 portoes independentes exigidos para o bot
# enviar qualquer ordem real -- os outros dois sao a flag --live na linha de
# comando e a variavel de ambiente ARBITRAGE_BOT_LIVE_CONFIRM=I_UNDERSTAND_THE_RISK.
# Os tres precisam estar ativos ao mesmo tempo (ver arbitrage_bot/live_executor.py).
# Sem isso, o bot roda 100% em paper trading mesmo com --live na linha de comando.
# Arbitragem triangular permanece SEMPRE em paper trading nesta versao, mesmo
# com o modo live ativado para arbitragem entre exchanges.
# Credenciais (NUNCA coloque aqui): defina as variaveis de ambiente
# {EXCHANGE_ID}_API_KEY e {EXCHANGE_ID}_API_SECRET (ex: BINANCE_API_KEY).
live:
  enabled: false
  order_timeout_seconds: 10.0
